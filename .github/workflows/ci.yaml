name: C++ Makefile CI

on:
  push:
    branches: 
      - main
      - development
    tags: 
      - 'v*'
  pull_request:
    branches: 
      - main
      - development

jobs:
  # BUILD: Linux + Windows
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Clang (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y clang

    - name: Setup MinGW (Windows)
      if: runner.os == 'Windows'
      uses: egor-tensin/setup-mingw@v2
      with:
        platform: x64

    - name: Build
      run: make

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mycli-${{ runner.os }}-${{ github.ref_name }}
        path: dist/
        retention-days: 30

  # CHECK: Debian Only
  check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Clang
      run: sudo apt-get update && sudo apt-get install -y clang

    - name: Build
      run: make

    - name: Run Tests
      run: |
        echo "exit" | ./dist/test_linux
        echo "help" | ./dist/test_linux

    - name: Static Analysis
      run: |
        sudo apt-get install -y cppcheck
        cppcheck --enable=all --error-exitcode=1 src/*.cc

  # RELEASE: Hanya di main dengan tag
  release:
    needs: [build, check]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/mycli-Linux-main/*
          artifacts/mycli-Windows-main/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}