name: C++ CMake CI/CD

on:
  push:
    branches: [main, development]
    tags: ['v*']
  pull_request:
    branches: [main, development]

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        config: [Release]   # atau [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Cache build
        uses: actions/cache@v3
        with:
          path: build
          key: ${{ runner.os }}-${{ matrix.config }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Build
        run: cmake --build build --config ${{ matrix.config }}

      - name: Run tests
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanczos-windows-${{ matrix.config }}
          path: build/Release/main.exe   # sesuaikan dengan path sebenarnya

  release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}