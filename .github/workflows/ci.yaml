name: Yuna Pipeline

on:
  push:
    branches: [main, development, "fix/*", "feat/*"]
    tags: ['v*']
  pull_request:
    branches: [main, development]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Release]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -B build
          -DBUILD_TESTS=ON
          -DYUNA_BUILD_NUMBER=${{ github.run_number }}

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel

      - name: Run tests
        run: build\${{ matrix.config }}\tests.exe
        shell: cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yuna-windows-${{ matrix.config }}
          path: |
            build/${{ matrix.config }}/Yuna.exe
            build/${{ matrix.config }}/*.dll
          if-no-files-found: error

  release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.exe
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}