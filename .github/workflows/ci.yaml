name: C++ Makefile CI

on:
  push:
    branches: [main, development]
    tags: ['v*']
  pull_request:
    branches: [main, development]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make cppcheck dos2unix
          dos2unix Makefile
      - name: Static Analysis
        run: cppcheck --enable=warning,style,performance --inline-suppr --error-exitcode=1 src/
      - name: Build & Test
        run: |
          make clean
          make
          make test
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanczos-linux
          path: dist/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & Test
        shell: cmd
        run: |
          make clean
          make
          make test
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanczos-windows
          path: dist/

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/lanczos-windows/**/*.exe
            artifacts/lanczos-linux/**/main
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
