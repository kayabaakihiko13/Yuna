name: C++ Makefile CI

on:
  push:
    branches: [main, development]
    tags: ['v*']
  pull_request:
    branches: [main, development]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Gunakan windows-latest atau windows-2022
        os: [ubuntu-latest, windows-2022]
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y clang make cppcheck

    - name: Static Analysis (Linux Only)
      if: runner.os == 'Linux'
      run: |
        cppcheck --enable=warning,style,performance \
                 --inline-suppr \
                 --error-exitcode=1 \
                 src/ test/ \
                 --suppress=missingIncludeSystem

    - name: Build & Test
      # Menggunakan bash secara eksplisit di semua OS agar sintaksnya konsisten
      shell: bash
      run: |
        # 1. Paksa ubah format Makefile dari CRLF ke LF langsung di runner
        sed -i 's/\r$//' Makefile
        
        # 2. Jalankan make secara manual per target untuk menghindari error di clean
        # Kita pakai '|| true' supaya jika gagal tidak langsung mematikan workflow
        make clean || echo "Clean skipped"
        
        # 3. Jalankan build utama
        make
        
        # 4. Jalankan test
        make test

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: lanczos-${{ runner.os }}
        path: dist/
        retention-days: 7

  release:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v2 # Update ke v2 yang lebih stabil
      with:
        # Menggunakan pola globbing yang lebih aman
        files: |
          artifacts/lanczos-Windows/**/*.exe
          artifacts/lanczos-Linux/**/main
          artifacts/lanczos-Linux/**/test_linux
          artifacts/lanczos-Windows/**/test_window.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
