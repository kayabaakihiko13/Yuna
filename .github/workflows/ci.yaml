name: C++ Makefile CI

on:
  push:
    branches: [main, development]
    tags: ['v*']
  pull_request:
    branches: [main, development]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022]
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y clang make cppcheck

    - name: Static Analysis (Linux Only)
      if: runner.os == 'Linux'
      run: |
        cppcheck --enable=warning,style,performance \
                 --inline-suppr \
                 --error-exitcode=1 \
                 src/ test/ \
                 --suppress=missingIncludeSystem

    - name: Build & Test
      shell: bash
      run: |
        make clean
        make
        make test

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: lanczos-${{ runner.os }}
        path: dist/
        retention-days: 7

  release:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        # Mengambil semua file di dalam folder artifacts secara rekursif
        files: |
          artifacts/**/*.exe
          artifacts/**/main
          artifacts/**/test_linux
          artifacts/**/test_window.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
